AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFormation template to create two S3 buckets and optional EC2 resources for a beginner lab.
# This lab currently enables only the S3 bucket resources because EC2 creation is restricted in many AWS Academy environments.
Resources:
  # EC2 Instance 1
  #EC2Instance1:
  #  Type: AWS::EC2::Instance
  #  Properties:
  #    InstanceType: t2.micro
  #    ImageId: ami-0e86e20dae9224db8 # Ubuntu us-east-1
  #    KeyName: !Ref KeyPairName
  #    SecurityGroups:
  #      - !Ref EC2SecurityGroup

  # EC2 Instance 2
  #EC2Instance2:
  #  Type: AWS::EC2::Instance
  #  Properties:
  #    InstanceType: t2.micro
  #    ImageId: ami-0e86e20dae9224db8 # Ubuntu us-east-1
  #    KeyName: !Ref KeyPairName
  #    SecurityGroups:
  #      - !Ref EC2SecurityGroup

  # Security Group for EC2 Instances
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH access
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0 # Open to all IPs (use with caution)

  # S3 Bucket 1
  S3Bucket1:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-bucket1-${AWS::Region}"

  # S3 Bucket 2
  S3Bucket2:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-bucket2-${AWS::Region}"

Parameters:
  KeyPairName:
    Description: Name of an existing EC2 KeyPair for SSH access
    Type: String
    Default: vockey # Default of AWS Academy

Outputs:
  #Instance1PublicIP:
  #  Description: Public IP of the first EC2 instance
  #  Value: !GetAtt EC2Instance1.PublicIp

  #Instance2PublicIP:
  #  Description: Public IP of the second EC2 instance
  #  Value: !GetAtt EC2Instance2.PublicIp

  S3Bucket1Name:
    Description: Name of the first S3 bucket
    Value: !Ref S3Bucket1

  S3Bucket2Name:
    Description: Name of the second S3 bucket
    Value: !Ref S3Bucket2
